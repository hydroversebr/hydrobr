name: Atualizar Histórico de Clones

on:
  schedule:
    # Executa toda segunda-feira às 09:00 UTC (06:00 no horário de Brasília)
    - cron: '0 9 * * 1'
  workflow_dispatch: # Permite rodar manualmente para testar

permissions:
  contents: write # Essencial para poder fazer push dos dados de volta

jobs:
  update-clones:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2

      - name: Instalar pacotes necessários
        run: |
          install.packages(c("gh", "remotes"))
          # Se o seu script usar funções do próprio pacote, instale-o:
          # remotes::install_local(".")
        shell: Rscript {0}

      - name: Executar script de atualização
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }} # Token automático do Actions
        run: Rscript inst/scripts/update_clones.R

      - name: Fazer commit e push das alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add inst/extdata/clones_history.csv
          # Só faz commit se houver mudanças
          git diff --quiet && git diff --staged --quiet || git commit -m "Atualiza histórico de clones [skip ci]"
          git push
